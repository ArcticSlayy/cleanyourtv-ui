# Keeps this fork current with CleanYourTV: every day, merges Gathin23/cleanyourtv's main into main.
# The fork only adds files (launcher-ui/, docs/ui/, .github/README.md, this workflow, examples/*/remote.json), so
# the merge is normally clean. When it isn't (a conflict), or GitHub refuses the push (an upstream change to
# .github/workflows needs a token with the "workflows" scope), it opens one issue with what to run by hand.
name: Sync with CleanYourTV

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'matheus-caldeira/cleanyourtv-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already current with upstream."
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "Merge CleanYourTV (upstream main)" upstream/main; then
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "status=push-refused" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when it needs a hand
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'push-refused'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          title="Sync with CleanYourTV needs a hand"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue is already open."
            exit 0
          fi
          if [ "$STATUS" = conflict ]; then
            why="Merging upstream main conflicts with this fork's changes."
          else
            why="The merge is clean, but GitHub refused the push (usually an upstream change under .github/workflows, which the workflow token can't push)."
          fi
          gh issue create --title "$title" --body "$why

          Run on a clone of this repository:

          \`\`\`bash
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git  # once
          git fetch upstream && git merge upstream/main
          # solve any conflict, keeping upstream's version of its own files
          git push origin main
          \`\`\`

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
